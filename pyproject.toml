[project]
name = "ai"
version = "0.1.0"
description = "AI projects workspace"
dependencies = [
    "bs4>=0.0.2",
    "datasets>=4.1.1",
    "feedparser>=6.0.12",
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "keras>=3.10.0",
    "langgraph>=0.2.70",
    "langchain-core>=0.3.30",
    "textblob>=0.19.0",
    "torch>=2.7.1",
    "transformers>=4.53.3",
    "vadersentiment>=3.3.2",
    "langchain>=0.3.26",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
    "mypy>=1.0.0",
    "ipykernel>=6.29.0",
]

[tool.uv.workspace]
members = [
    "packages/*",
]
exclude = [
    "packages/airflow",
    "packages/ai-sdk",
    "packages/books",
    "packages/langraph-ts-examples",
] 
