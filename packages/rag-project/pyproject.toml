[project]
name = "rag-project"
version = "0.1.0"
description = "RAG 프로젝트"
requires-python = ">=3.9"
dependencies = [
    "langchain>=0.1.0",
    "chromadb>=0.4.0",
    "openai>=1.0.0",
    "streamlit>=1.28.0",
]

[tool.hatch.build.targets.wheel]
only-include = ["*.py", "packages/**"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build" 