[project]
name = "tensorflow-learning"
version = "0.1.0"
description = "코드로 배우는 인공지능"
dependencies = [
    "keras>=3.10.0",
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "numpy>=2.0.0",
]
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

