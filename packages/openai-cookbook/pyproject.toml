[project]
name = "openai-cookbook"
version = "0.1.0"
description = "OpenAI API 쿡북 예제"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.5.0",
    "scikit-learn>=1.3.0",
    "tiktoken>=0.5.0",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
only-include = ["*.py", "*.ipynb", "data/**", "utils/**"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build" 