[project]
name = "ollama-examples"
version = "0.1.0"
description = "Ollama API 사용 예제"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "ollama>=0.3.0",
]

[tool.hatch.build.targets.wheel]
only-include = ["*.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build" 