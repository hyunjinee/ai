[project]
name = "book-recommender"
version = "0.1.0"
description = "책 추천 시스템"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "gradio>=4.0.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "jupyter>=1.0.0",
    "kagglehub>=0.2.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
]

[tool.hatch.build.targets.wheel]
only-include = ["*.py", "*.ipynb", "*.csv", "*.txt", "*.jpg"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
