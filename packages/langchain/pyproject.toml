[project]
name = "langchain-examples"
version = "0.1.0"
description = "LangChain 예제 모음"
requires-python = ">=3.9"
dependencies = [
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",
    "langgraph>=0.0.20",
    "openai>=1.0.0",
    "jupyter>=1.0.0",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
only-include = ["*.py", "*.ipynb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build" 