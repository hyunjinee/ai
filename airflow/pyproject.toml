[project]
name = "airflow-pipeline"
version = "0.1.0"
description = "Apache Airflow 데이터 파이프라인"
requires-python = ">=3.9"
dependencies = [
    "apache-airflow>=2.7.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.optional-dependencies]
gcp = [
    "apache-airflow-providers-google>=10.0.0",
]
aws = [
    "apache-airflow-providers-amazon>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build" 